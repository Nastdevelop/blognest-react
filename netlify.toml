[build]
  command = "npx prisma generate && npm run build"
  functions = "netlify/functions"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  included_files = ["dist/**", "prisma/**", "node_modules/.prisma/**", "node_modules/@prisma/**"]
  node_bundler = "esbuild"
  external_node_modules = [
    "@nestjs/microservices",
    "@nestjs/websockets",
    "class-transformer",
    "@prisma/client",
    ".prisma",
    "bcryptjs"
  ]

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
